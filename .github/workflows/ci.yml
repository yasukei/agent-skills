name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# 同じ PR に新しい push があったら、古い実行を取り消す
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # シェルスクリプトの静的チェックとテスト。
  # SKILL.md やプラグインの検証は、別のジョブとしてここに足す
  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Tool versions
        run: |
          bash --version | head -1
          shellcheck --version | head -2
          jq --version
          git --version
      - name: Lint (bash -n, shellcheck)
        run: tests/run.sh lint
      - name: Test (setup.sh, pr_status.sh)
        run: tests/run.sh test
