name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Cancel older runs when the same PR gets a new push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Static checks and tests of the shell scripts.
  # When adding a job, also add it to ci-ok's needs
  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job pushes, so do not leave the token in .git/config
          persist-credentials: false
      - name: Tool versions
        run: |
          bash --version | head -1
          shellcheck --version | head -2
          jq --version
          git --version
          python3 --version
          python3 -c 'import yaml; print("PyYAML", yaml.__version__)'
      - name: Lint (bash -n, shellcheck)
        run: tests/run.sh lint
      - name: Test (pr_status.sh, signature.sh, detect.sh, wait_ci.sh, validate-skills.py, check-plugin-policy.py)
        run: tests/run.sh test

  # Validate the frontmatter of skills/*/SKILL.md and the files it references
  skills:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job pushes, so do not leave the token in .git/config
          persist-credentials: false
      - name: Tool versions
        run: |
          python3 --version
          python3 -c 'import yaml; print("PyYAML", yaml.__version__)'
      - name: Validate SKILL.md
        run: scripts/validate-skills.py

  # Policy check of the Claude / ChatGPT / Codex manifests, and Claude's schema validation.
  # claude plugin validate runs without authentication, so no API key etc. is configured
  plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DISABLE_AUTOUPDATER: 1
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job pushes, so do not leave the token in .git/config
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Pinned in .github-ci/claude-code (package.json and its lockfile), because the latest version
      # can suddenly fail on changed validation rules. Dependabot opens a PR to update it, and that
      # PR's CI checks it
      - name: Install Claude Code
        run: |
          npm ci --prefix .github-ci/claude-code --no-audit --no-fund
          echo "$GITHUB_WORKSPACE/.github-ci/claude-code/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Tool versions
        run: |
          claude --version
          python3 --version
      - name: Check plugin policy
        run: scripts/check-plugin-policy.py
      - name: Validate plugin (claude plugin validate)
        # Run even if the policy check fails, so schema problems show up in the same run
        if: ${{ !cancelled() }}
        run: claude plugin validate .

  # Static analysis of the workflows and dependabot.yml for security problems
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          # Print findings as annotations instead of uploading SARIF, which needs security-events: write
          advanced-security: false
          annotations: true
          # zizmor itself is not pinned (the action uses the latest release): new audits may fail CI
          # without a change here, which is accepted in exchange for no maintenance

  # Succeeds only when all jobs succeed.
  # Branch protection only needs this job as the required check, so adding jobs needs no settings change
  ci-ok:
    needs: [scripts, skills, plugin, zizmor]
    # Run always, so that this job fails instead of being skipped when a job in needs fails
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check results of all jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' >/dev/null
