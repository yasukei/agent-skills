name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# 同じ PR に新しい push があったら、古い実行を取り消す
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # シェルスクリプトの静的チェックとテスト。
  # プラグインの検証などのジョブを足したら、ci-ok の needs にも足す
  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Tool versions
        run: |
          bash --version | head -1
          shellcheck --version | head -2
          jq --version
          git --version
          python3 --version
          python3 -c 'import yaml; print("PyYAML", yaml.__version__)'
      - name: Lint (bash -n, shellcheck)
        run: tests/run.sh lint
      - name: Test (setup.sh, pr_status.sh, validate-skills.py, check-plugin-policy.py)
        run: tests/run.sh test

  # skills/*/SKILL.md の frontmatter と参照ファイルの検証
  skills:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Tool versions
        run: |
          python3 --version
          python3 -c 'import yaml; print("PyYAML", yaml.__version__)'
      - name: Validate SKILL.md
        run: scripts/validate-skills.py

  # .claude-plugin/ のマニフェストの検証。
  # claude plugin validate は認証なしで動くので、API キーなどは設定しない
  plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # 最新版を使うと、検証ルールの変更で突然失敗することがあるので固定する。
      # 上げるときは、ローカルで同じバージョンの claude plugin validate . が通ることを確かめてから
      CLAUDE_CODE_VERSION: 2.1.302
      DISABLE_AUTOUPDATER: 1
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
      - name: Tool versions
        run: |
          claude --version
          python3 --version
      - name: Check plugin policy
        run: scripts/check-plugin-policy.py
      - name: Validate plugin (claude plugin validate)
        run: claude plugin validate .

  # すべてのジョブが成功したときだけ成功する。
  # ブランチ保護の必須チェックにはこのジョブだけを指定すれば、ジョブを足しても設定を変えずに済む
  ci-ok:
    needs: [scripts, skills, plugin]
    # needs のジョブが失敗しても skipped にならず、このジョブ自体が失敗するように常に実行する
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check results of all jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' >/dev/null
