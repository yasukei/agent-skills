name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Cancel older runs when the same PR gets a new push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Static checks and tests of the shell scripts.
  # When adding a job, also add it to ci-ok's needs
  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Tool versions
        run: |
          bash --version | head -1
          shellcheck --version | head -2
          jq --version
          git --version
          python3 --version
          python3 -c 'import yaml; print("PyYAML", yaml.__version__)'
      - name: Lint (bash -n, shellcheck)
        run: tests/run.sh lint
      - name: Test (setup.sh, pr_status.sh, signature.sh, validate-skills.py, check-plugin-policy.py)
        run: tests/run.sh test

  # Validate the frontmatter of skills/*/SKILL.md and the files it references
  skills:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Tool versions
        run: |
          python3 --version
          python3 -c 'import yaml; print("PyYAML", yaml.__version__)'
      - name: Validate SKILL.md
        run: scripts/validate-skills.py

  # Policy check of the Claude / ChatGPT / Codex manifests, and Claude's schema validation.
  # claude plugin validate runs without authentication, so no API key etc. is configured
  plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Pinned, because the latest version can suddenly fail on changed validation rules.
      # Before bumping it, check that claude plugin validate . passes locally with the same version
      CLAUDE_CODE_VERSION: 2.1.302
      DISABLE_AUTOUPDATER: 1
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
      - name: Tool versions
        run: |
          claude --version
          python3 --version
      - name: Check plugin policy
        run: scripts/check-plugin-policy.py
      - name: Validate plugin (claude plugin validate)
        # Run even if the policy check fails, so schema problems show up in the same run
        if: ${{ !cancelled() }}
        run: claude plugin validate .

  # Succeeds only when all jobs succeed.
  # Branch protection only needs this job as the required check, so adding jobs needs no settings change
  ci-ok:
    needs: [scripts, skills, plugin]
    # Run always, so that this job fails instead of being skipped when a job in needs fails
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check results of all jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' >/dev/null
