version: 2
updates:
  # The Claude Code version CI uses for claude plugin validate.
  # Monthly, because Claude Code is released almost every day
  # Outside .github/, because GitHub rejected Dependabot's npm update PR for .github/claude-code
  - package-ecosystem: npm
    directory: /.github-ci/claude-code
    schedule:
      interval: monthly
    # Wait a week after a release, so a compromised or broken release can be pulled first
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci

  # Actions used by the workflows, so they do not fall behind (e.g. the Node.js 20 deprecation)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Wait a week after a release, so a compromised or broken release can be pulled first
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci

  # Python dependencies used by the development checks
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    # Wait a week after a release, so a compromised or broken release can be pulled first
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
